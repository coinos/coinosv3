# F-Droid build recipe for the bundled Android build (metadata/io.coinos.fdroid.yml
# in fdroiddata). The web app is built first with a checksum-pinned Bun, then
# the Gradle flavor packs dist/ into the APK as assets. Both halves are
# reproducible: two clean builds give the same unsigned APK, so F-Droid can
# publish the coinos-signed release once its own build matches (Binaries +
# AllowedAPKSigningKeys). Summary/description/icon/changelogs live in
# fastlane/ in this repo — F-Droid pulls them from there.
Categories:
  - Wallet
License: MIT
AuthorName: Adam Soltys
WebSite: https://v3.coinos.io
SourceCode: https://github.com/coinos/coinosv3
IssueTracker: https://github.com/coinos/coinosv3/issues

AutoName: Coinos

RepoType: git
Repo: https://github.com/coinos/coinosv3.git
Binaries: https://github.com/coinos/coinosv3/releases/download/fdroid-v%v/coinos-fdroid-%v.apk

Builds:
  - versionName: '1.7'
    versionCode: 8
    commit: fdroid-v1.7
    subdir: android/app
    sudo:
      - curl -fsSL -o /tmp/bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.3.9/bun-linux-x64-baseline.zip
      - echo "104d4d037f4b35e10215c0507e1779691f39c57bd91ddeefe11cad781e3fc4b9  /tmp/bun.zip"
        | sha256sum -c
      - unzip -q /tmp/bun.zip -d /tmp/bun
      - install -m 0755 /tmp/bun/bun-linux-x64-baseline/bun /usr/local/bin/bun
    gradle:
      - fdroid
    prebuild: cd ../.. && bun install --frozen-lockfile && HAL_NO_SW=1 bun run build
    scandelete:
      - node_modules

AllowedAPKSigningKeys: 766483ab8372c02f8406d29595e7389a2869190b429e0ffd092ebb0bfa2bc2f4

AutoUpdateMode: Version
UpdateCheckMode: Tags ^fdroid-v[0-9.]+$
CurrentVersion: '1.7'
CurrentVersionCode: 8
